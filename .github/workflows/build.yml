name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'microsoft'
      - run: ./gradlew build
      - uses: actions/upload-artifact@v3
        with:
          name: hitbox-mod
          path: build/libs/*.jar
